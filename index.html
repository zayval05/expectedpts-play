<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Value">
  <title>Play Value - Track the Play. Measure the Look.</title>

  <!-- Home Screen App Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Oswald', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .court-pin {
      transition: transform 0.15s ease-out;
      cursor: pointer;
    }
    .court-pin:hover {
      transform: scale(1.4);
      z-index: 30;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md px-3 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Active Game Selector -->
      <div class="flex items-center space-x-3">
        <!-- Play Value Custom Uploaded Logo -->
        <img src="logo.png" alt="Play Value Logo" class="w-10 h-10 rounded-xl object-contain border border-amber-500/30 shadow-lg shadow-amber-500/10">
        
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
            Track the Play. Measure the Look.
            <span class="text-[10px] font-normal text-amber-400 bg-amber-950/80 border border-amber-800/60 px-2 py-0.5 rounded-full font-mono">v3.0</span>
          </h1>
          
          <!-- Active Game Selector Dropdown -->
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[11px] text-slate-400 font-semibold uppercase">Active Game:</span>
            <select id="activeGameSelect" onchange="switchActiveGame(this.value)" class="bg-slate-950 border border-amber-500/40 text-amber-300 text-xs font-bold rounded-md px-2 py-0.5 focus:outline-none focus:border-amber-400">
              <!-- Dynamically populated -->
            </select>
          </div>
        </div>
      </div>

      <!-- Main Action Buttons -->
      <div class="flex items-center flex-wrap gap-2">
        
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
          <button id="tabTrackerBtn" onclick="switchTab('tracker')" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-semibold shadow transition-all">
            Tracker
          </button>
          <button id="tabAnalyticsBtn" onclick="switchTab('analytics')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">
            Analytics
          </button>
          <button id="tabLogBtn" onclick="switchTab('log')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">
            Game Log
          </button>
        </div>

        <!-- Management Controls -->
        <div class="flex items-center space-x-1.5">
          <!-- Game Manager Modal Button -->
          <button onclick="openGamesModal()" class="flex items-center gap-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2m-6 0h6a2 2 0 012 2v8a2 2 0 01-2 2H10a2 2 0 01-2-2V7z"/></svg>
            Manage Games
          </button>

          <!-- Roster Manager -->
          <button onclick="openRosterModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all">
            Roster
          </button>

          <!-- Playbook Manager -->
          <button onclick="openPlaybookModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all">
            Playbook
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 space-y-5">

    <!-- VIEW TAB 1: TRACKER -->
    <div id="tabTracker" class="grid grid-cols-1 lg:grid-cols-12 gap-5">

      <!-- LEFT: SVG HARDWOOD COURT (7 Cols) -->
      <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex flex-col shadow-xl">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            <h2 class="text-xs font-bold tracking-wide uppercase text-slate-300">Interactive Shot Location</h2>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <label class="flex items-center gap-1 text-slate-400 cursor-pointer text-[11px]">
              <input type="checkbox" id="toggleShotPins" checked onchange="renderCourtOverlay()" class="rounded bg-slate-800 border-slate-700 text-amber-500">
              Pins
            </label>
            <span id="clickCoordinates" class="font-mono text-slate-500 text-[10px]">Click Court</span>
          </div>
        </div>

        <!-- SVG Court Canvas Container -->
        <div class="relative w-full aspect-[50/47] bg-[#1d150f] rounded-xl border border-slate-800 overflow-hidden shadow-inner cursor-crosshair">
          
          <svg id="courtSvg" viewBox="0 0 500 470" class="w-full h-full" onclick="handleCourtClick(event)">
            <defs>
              <pattern id="hardwood" width="40" height="20" patternUnits="userSpaceOnUse">
                <rect width="40" height="20" fill="#2d2017"/>
                <line x1="0" y1="0" x2="40" y2="0" stroke="#231810" stroke-width="1"/>
                <line x1="0" y1="10" x2="40" y2="10" stroke="#231810" stroke-width="1"/>
                <line x1="20" y1="0" x2="20" y2="10" stroke="#231810" stroke-width="0.8"/>
                <line x1="0" y1="10" x2="0" y2="20" stroke="#231810" stroke-width="0.8"/>
              </pattern>
            </defs>

            <!-- Court Base Floor -->
            <rect width="500" height="470" fill="url(#hardwood)"/>
            <rect width="500" height="470" fill="none" stroke="#3d2a1d" stroke-width="8"/>

            <!-- Key Box / Paint Area -->
            <rect x="170" y="10" width="160" height="190" fill="#3b2016" fill-opacity="0.6" stroke="#ffffff" stroke-width="2.5"/>
            
            <!-- Free Throw Circle -->
            <path d="M 170 200 A 80 80 0 0 0 330 200" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,6"/>
            <path d="M 170 200 A 80 80 0 0 1 330 200" fill="none" stroke="#ffffff" stroke-width="2.5"/>

            <!-- Restricted Area Arc -->
            <path d="M 210 52.5 A 40 40 0 0 0 290 52.5" fill="none" stroke="#ffffff" stroke-width="2"/>

            <!-- Backboard & Hoop Assembly -->
            <line x1="210" y1="40" x2="290" y2="40" stroke="#ffffff" stroke-width="4"/>
            <line x1="250" y1="40" x2="250" y2="45" stroke="#e2e8f0" stroke-width="3"/>
            <circle cx="250" cy="52.5" r="7.5" fill="none" stroke="#f97316" stroke-width="3"/>

            <!-- 3-Point Arc -->
            <line x1="30" y1="10" x2="30" y2="130" stroke="#ffffff" stroke-width="2.5"/>
            <line x1="470" y1="10" x2="470" y2="130" stroke="#ffffff" stroke-width="2.5"/>
            <path d="M 30 130 A 221.5 221.5 0 0 0 470 130" fill="none" stroke="#ffffff" stroke-width="2.5"/>

            <!-- Halfcourt Line & Circle -->
            <line x1="0" y1="465" x2="500" y2="465" stroke="#ffffff" stroke-width="3"/>
            <path d="M 190 465 A 60 60 0 0 1 310 465" fill="none" stroke="#ffffff" stroke-width="2.5"/>

            <!-- Overlay Pins Layer Group -->
            <g id="courtOverlayGroup"></g>

            <!-- Active Selected Target Marker -->
            <g id="activeTargetMarker" style="display: none;">
              <circle cx="0" cy="0" r="12" fill="none" stroke="#f59e0b" stroke-width="2" class="animate-ping"/>
              <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
            </g>
          </svg>

        </div>

        <!-- Spatial Math Readout Bar -->
        <div class="mt-2.5 bg-slate-950 p-2.5 rounded-xl border border-slate-800 grid grid-cols-3 gap-2 text-center text-xs">
          <div>
            <span class="text-slate-500 block text-[9px] uppercase font-semibold">Location</span>
            <span id="readoutLocation" class="font-bold text-amber-400">Select Point</span>
          </div>
          <div>
            <span class="text-slate-500 block text-[9px] uppercase font-semibold">Side</span>
            <span id="readoutSide" class="font-bold text-slate-200">-</span>
          </div>
          <div>
            <span class="text-slate-500 block text-[9px] uppercase font-semibold">Distance</span>
            <span id="readoutDistance" class="font-bold text-slate-200">-</span>
          </div>
        </div>
      </div>

      <!-- RIGHT: LOGGING FORM PANEL (5 Cols) -->
      <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl space-y-3">
        
        <div>
          <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
            <h2 class="text-sm font-bold text-white flex items-center gap-1.5">
              <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Log Possession
            </h2>
            <span id="xpPreviewBadge" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-mono font-bold px-2 py-0.5 rounded">
              Est xP: --
            </span>
          </div>

          <form id="possessionForm" onsubmit="handlePossessionSubmit(event)" class="space-y-3">
            
            <!-- Player Select -->
            <div>
              <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Player</label>
              <select id="formPlayer" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <!-- Populated via JS -->
              </select>
            </div>

            <!-- Play Call Select -->
            <div>
              <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Play Call / Set</label>
              <select id="formPlay" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <!-- Populated via JS -->
              </select>
            </div>

            <!-- Primary Outcome -->
            <div>
              <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Outcome</label>
              <select id="formOutcome" required onchange="updateFormFields()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                <option value="Made FG">Made Field Goal</option>
                <option value="Missed FG">Missed Field Goal</option>
                <option value="Shooting Foul">Shooting Foul Drawn (FTs)</option>
                <option value="Turnover">Turnover</option>
                <option value="Non-Shooting Foul">Non-Shooting Foul</option>
              </select>
            </div>

            <!-- Shot Type Chips (6 Types) -->
            <div id="shotTypeSection">
              <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Shot Type</label>
              <div class="grid grid-cols-3 gap-1">
                <button type="button" onclick="selectShotType('Catch & Shoot')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Catch & Shoot">Catch & Shoot</button>
                <button type="button" onclick="selectShotType('Off the Dribble')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Off the Dribble">Off Dribble</button>
                <button type="button" onclick="selectShotType('Layup')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Layup">Layup</button>
                <button type="button" onclick="selectShotType('Dunk')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Dunk">Dunk</button>
                <button type="button" onclick="selectShotType('Post Shot')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Post Shot">Post Shot</button>
                <button type="button" onclick="selectShotType('Other')" class="shot-type-chip px-1.5 py-1 rounded border border-slate-800 bg-slate-950 text-slate-300 text-[11px] font-medium text-center" data-val="Other">Other</button>
              </div>
            </div>

            <!-- Contest Level Buttons -->
            <div id="contestSection">
              <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Contest Level</label>
              <div class="grid grid-cols-3 gap-1.5">
                <button type="button" onclick="selectContest(3)" class="contest-chip p-1.5 rounded border border-emerald-900/60 bg-emerald-950/40 text-emerald-300 text-xs text-center flex flex-col items-center" data-val="3">
                  <span class="font-bold">3 - Open</span>
                </button>
                <button type="button" onclick="selectContest(2)" class="contest-chip p-1.5 rounded border border-amber-900/60 bg-amber-950/40 text-amber-300 text-xs text-center flex flex-col items-center" data-val="2">
                  <span class="font-bold">2 - Slight</span>
                </button>
                <button type="button" onclick="selectContest(1)" class="contest-chip p-1.5 rounded border border-rose-900/60 bg-rose-950/40 text-rose-300 text-xs text-center flex flex-col items-center" data-val="1">
                  <span class="font-bold">1 - Heavy</span>
                </button>
              </div>
            </div>

            <!-- Actual Pts Input -->
            <div id="actualPtsSection" class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Actual Points</label>
                <input type="number" id="formActualPts" min="0" max="4" value="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold focus:outline-none focus:border-amber-500">
              </div>
              <div id="ftTripContainer" class="hidden">
                <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">FT Trip Result</label>
                <select id="formFtResult" onchange="calcFtActualPts()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-[11px] text-white">
                  <option value="2/2">2/2 Made (2 pts)</option>
                  <option value="1/2
