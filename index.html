<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track the Play. Measure the Look. | JUCO Basketball Analytics</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              900: '#7c2d12',
            },
            court: {
              floor: '#1e293b',
              paint: '#0f172a',
              line: '#38bdf8',
              wood: '#2a1a08'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Firestore (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Production Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKey_ReplaceIfProductionSyncEnabled",
      authDomain: "play-value.firebaseapp.com",
      projectId: "play-value",
      storageBucket: "play-value.appspot.com",
      messagingSenderId: "102938475610",
      appId: "1:102938475610:web:abc123def456"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.firebaseDoc = doc;
      window.firebaseSetDoc = setDoc;
      window.firebaseGetDoc = getDoc;
      window.firebaseOnSnapshot = onSnapshot;
      console.log("Firebase initialized successfully.");
    } catch (err) {
      console.warn("Firebase running in offline/local fallback mode:", err);
    }
  </script>

  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .court-svg {
      user-select: none;
      touch-action: none;
    }
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP HEADER / NAVBAR -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <!-- Title & Branding -->
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-orange-600/20 text-orange-500 rounded-lg border border-orange-500/30">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide text-white">
            Track the Play. Measure the Look.
            <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">v3.1 Synergy Hub</span>
          </h1>
          <p class="text-xs text-slate-400">JUCO Basketball Analytics & Spatial Expected Points Engine</p>
        </div>
      </div>

      <!-- Controls & Selectors -->
      <div class="flex items-center flex-wrap gap-3 text-xs">
        <!-- Active Game Selector -->
        <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 px-2 py-1">
          <span class="text-slate-400 mr-2 font-medium">GAME:</span>
          <select id="gameSelect" onchange="switchGame(this.value)" class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer">
            <!-- Dynamic Options -->
          </select>
        </div>

        <!-- Baseline Model Selector -->
        <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 px-2 py-1">
          <span class="text-slate-400 mr-2 font-medium">xP BASELINE:</span>
          <select id="baselineSelect" onchange="changeBaseline(this.value)" class="bg-transparent text-orange-400 font-semibold focus:outline-none cursor-pointer">
            <option value="JUCO">JUCO Averages</option>
            <option value="NCAA_D1">NCAA D1 Standard</option>
            <option value="NCAA_D2">NCAA D2 Standard</option>
            <option value="NCAA_D3">NCAA D3 Standard</option>
            <option value="PLAYER_STATS">Active Player Model</option>
          </select>
        </div>

        <!-- Synergy Hub Button -->
        <button onclick="openSynergyModal()" class="flex items-center space-x-1.5 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-semibold px-3 py-1.5 rounded-lg shadow-lg shadow-orange-900/30 transition">
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>Synergy Hub</span>
        </button>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
          <button id="tabTracker" onclick="switchTab('tracker')" class="px-3 py-1 rounded-md text-slate-300 font-medium hover:text-white transition">Tracker</button>
          <button id="tabAnalytics" onclick="switchTab('analytics')" class="px-3 py-1 rounded-md text-slate-300 font-medium hover:text-white transition">Analytics</button>
          <button id="tabGameLog" onclick="switchTab('gamelog')" class="px-3 py-1 rounded-md text-slate-300 font-medium hover:text-white transition">Game Log</button>
          <button id="tabRoster" onclick="switchTab('roster')" class="px-3 py-1 rounded-md text-slate-300 font-medium hover:text-white transition">Roster</button>
          <button id="tabPlaybook" onclick="switchTab('playbook')" class="px-3 py-1 rounded-md text-slate-300 font-medium hover:text-white transition">Playbook</button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all">
      <i data-lucide="info" class="w-5 h-5 text-orange-400"></i>
      <span id="toastMsg" class="text-sm font-medium">Notification message</span>
    </div>

    <!-- ==================== TAB 1: TRACKER ==================== -->
    <section id="viewTracker" class="space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Interactive SVG Court (7 Cols) -->
        <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center">
          <div class="w-full flex items-center justify-between mb-3 px-2">
            <div class="flex items-center space-x-2">
              <i data-lucide="crosshair" class="w-4 h-4 text-orange-500"></i>
              <h2 class="font-bold text-sm text-slate-200">Interactive Spatial Shot Court</h2>
            </div>
            <span class="text-xs text-slate-400">Click court location to auto-populate shot coordinates</span>
          </div>

          <!-- SVG Court Canvas -->
          <div class="relative w-full max-w-[500px] aspect-[500/470] bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shadow-inner">
            <svg id="courtSvg" viewBox="0 0 500 470" class="w-full h-full court-svg cursor-crosshair" onclick="handleCourtClick(event)">
              <!-- Court Outline -->
              <rect x="0" y="0" width="500" height="470" fill="#18202c" stroke="#334155" stroke-width="4"/>
              <!-- Paint / Key -->
              <rect x="170" y="0" width="160" height="190" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
              <!-- Restricted Area -->
              <path d="M 210,0 A 40,40 0 0,0 290,0" fill="none" stroke="#38bdf8" stroke-width="2"/>
              <!-- Free Throw Circle -->
              <circle cx="250" cy="190" r="60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6"/>
              <!-- 3-Point Arc (NCAA Standard Scale) -->
              <path d="M 50,0 L 50,140 A 200,200 0 0,0 450,140 L 450,0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
              <!-- Backboard & Basket -->
              <line x1="220" y1="40" x2="280" y2="40" stroke="#ffffff" stroke-width="4"/>
              <circle cx="250" cy="52" r="12" fill="none" stroke="#f97316" stroke-width="3"/>
              
              <!-- Shot Pins Layer -->
              <g id="shotPinsGroup"></g>
              
              <!-- Active Click Indicator Pin -->
              <circle id="activePin" cx="-50" cy="-50" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2" class="animate-pulse hidden"/>
            </svg>
          </div>
          
          <div class="mt-3 flex items-center justify-between w-full max-w-[500px] text-xs text-slate-400 px-2">
            <div class="flex items-center space-x-2">
              <span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span><span>Made FG</span>
              <span class="inline-block w-3 h-3 rounded-full bg-rose-500 ml-2"></span><span>Missed FG</span>
            </div>
            <span id="coordDisplay" class="font-mono text-slate-400">Location: (X: --, Y: --)</span>
          </div>
        </div>

        <!-- Shot & Possession Logger Controls (5 Cols) -->
        <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <h2 class="font-bold text-slate-100 flex items-center space-x-2">
                <i data-lucide="edit-3" class="w
