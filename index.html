<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Value">
  <title>Play Value - Track the Play. Measure the Look.</title>

  <!-- Home Screen App Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase JS SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Oswald', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
    body { background-color: #090d16; color: #f8fafc; font-family: 'Inter', sans-serif; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .court-pin { transition: transform 0.15s ease-out; cursor: pointer; }
    .court-pin:hover { transform: scale(1.4); z-index: 30; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md px-3 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Active Game Selector -->
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Play Value Logo" class="w-10 h-10 rounded-xl object-contain border border-amber-500/30 shadow-lg shadow-amber-500/10 cursor-pointer" onclick="switchTab('home')">
        
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
            Track the Play. Measure the Look.
            <span class="text-[10px] font-normal text-amber-400 bg-amber-950/80 border border-amber-800/60 px-2 py-0.5 rounded-full font-mono">v3.7 Auth Ready</span>
          </h1>
          
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[11px] text-slate-400 font-semibold uppercase">Active Game:</span>
            <select id="activeGameSelect" onchange="switchActiveGame(this.value)" class="bg-slate-950 border border-amber-500/40 text-amber-300 text-xs font-bold rounded-md px-2 py-0.5 focus:outline-none focus:border-amber-400">
              <option value="game1">Sample Game vs Varsity</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Main Action Buttons & Navigation -->
      <div class="flex items-center flex-wrap gap-2">
        
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
          <button id="tabHomeBtn" onclick="switchTab('home')" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-semibold shadow transition-all">Home Setup</button>
          <button id="tabTrackerBtn" onclick="switchTab('tracker')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Tracker</button>
          <button id="tabAnalyticsBtn" onclick="switchTab('analytics')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Analytics</button>
          <button id="tabLogBtn" onclick="switchTab('log')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Game Log</button>
        </div>

        <!-- Management Controls -->
        <div class="flex items-center space-x-1.5">
          <button onclick="openGamesModal()" class="flex items-center gap-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2m-6 0h6a2 2 0 012 2v8a2 2 0 01-2 2H10a2 2 0 01-2-2V7z"/></svg>
            Manage Games
          </button>

          <!-- User Auth Status Badge -->
          <div id="authHeaderContainer">
            <button onclick="openAuthModal()" id="loginBtnHeader" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
              Sign In
            </button>
            <div id="userInfoHeader" class="hidden flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-lg text-xs">
              <span id="userEmailBadge" class="text-amber-400 font-mono font-bold text-[11px]"></span>
              <button onclick="handleSignOut()" class="text-slate-400 hover:text-rose-400 font-bold ml-1">✕</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 space-y-5">

    <!-- VIEW TAB 0: HOME / SETUP DASHBOARD -->
    <div id="tabHome" class="space-y-6">
      
      <!-- Welcome Hero Card -->
      <div class="bg-gradient-to-r from-slate-900 via-slate-900 to-amber-950/40 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="space-y-1.5 max-w-2xl">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest bg-amber-500/10 border border-amber-500/30 px-2.5 py-0.5 rounded-full">Play Value Command Center</span>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-white font-display">Manage Teams, Playbooks & Live Tracking</h2>
          <p class="text-xs text-slate-400 leading-relaxed">
            Create multiple teams and playbooks below. Switch active squads or playbooks anytime—your game files will use the selected active settings!
          </p>
        </div>
        <div class="
